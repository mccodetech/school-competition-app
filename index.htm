<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>സ്ഥാപനങ്ങളുടെ സ്കൂൾ ഫെസ്റ്റ് മാനേജർ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-light">

    <!-- ലോഗിൻ / സൈൻ അപ്പ് സെക്ഷൻ -->
    <div id="auth-section" class="container mt-5" style="max-width: 450px;">
        <div class="card shadow p-4">
            <h3 id="auth-title" class="text-center mb-3">സ്ഥാപന ലോഗിൻ</h3>
            <div class="mb-3">
                <label class="form-label">സ്ഥാപനത്തിന്റെ ഇമെയിൽ</label>
                <input type="email" id="auth-email" class="form-control" placeholder="example@school.com">
            </div>
            <div class="mb-3">
                <label class="form-label">പാസ്‌വേർഡ്</label>
                <input type="password" id="auth-password" class="form-control" placeholder="********">
            </div>
            <button id="auth-btn" onclick="handleLogin()" class="btn btn-primary w-100 mb-2">ലോഗിൻ ചെയ്യുക</button>
            <button id="toggle-auth-btn" onclick="toggleAuthMode()" class="btn btn-link w-100 text-decoration-none">അക്കൗണ്ട് ഇല്ലെങ്കിൽ പുതിയത് ഉണ്ടാക്കുക (Sign Up)</button>
        </div>
    </div>

    <!-- സ്ഥാപനത്തിന്റെ ഡാഷ്‌ബോർഡ് (ലോഗിൻ ചെയ്തതിനു ശേഷം കാണുന്നത്) -->
    <div id="dashboard-section" class="container mt-4" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>സ്ഥാപന അഡ്മിൻ പാനൽ: <span id="institution-email-display" class="text-primary fs-5"></span></h2>
            <button onclick="handleLogout()" class="btn btn-danger">ലോഗ് ഔട്ട്</button>
        </div>

        <!-- 1. എക്സൽ വഴി വിദ്യാർത്ഥികളുടെ വിവരങ്ങൾ അപ്‌ലോഡ് ചെയ്യാൻ -->
        <div class="card p-3 mb-4 shadow-sm">
            <h4>വിദ്യാർത്ഥികളുടെ വിവരങ്ങൾ അപ്‌ലോഡ് ചെയ്യുക (Excel)</h4>
            <p class="text-muted small">പേര് (Name), യു.ഐ.ഡി (UID), ക്ലാസ് (Class) എന്നീ കോളങ്ങൾ ഉള്ള എക്സൽ ഫയൽ നൽകുക.</p>
            <input type="file" id="excelFile" class="form-control mb-2" accept=".xlsx, .xls">
            <button onclick="uploadExcel()" class="btn btn-success">അപ്‌ലോഡ് ചെയ്യുക</button>
        </div>

        <!-- 2. മത്സര ഇനങ്ങൾ ചേർക്കൽ -->
        <div class="card p-3 mb-4 shadow-sm">
            <h4>മത്സര ഇനങ്ങൾ ചേർക്കുക</h4>
            <div class="input-group mb-2">
                <input type="text" id="competitionName" class="form-control" placeholder="മത്സരത്തിന്റെ പേര് (ഉദാ: പ്രസംഗം)">
                <button onclick="addCompetition()" class="btn btn-primary">ചേർക്കുക</button>
            </div>
            <ul id="competitionList" class="list-group mt-2"></ul>
        </div>

        <!-- 3. മത്സരങ്ങളിൽ പങ്കെടുക്കുന്നവരെ തിരഞ്ഞെടുക്കാൻ -->
        <div class="card p-3 mb-4 shadow-sm">
            <h4>മത്സരാർത്ഥികളെ പങ്കെടുപ്പിക്കുക & മാർക്ക് നൽകുക</h4>
            <div class="mb-3">
                <label class="form-label">മത്സരം തിരഞ്ഞെടുക്കുക</label>
                <select id="selectCompetition" class="form-select" onchange="loadParticipants()"></select>
            </div>
            <div class="mb-3">
                <label class="form-label">വിദ്യാർത്ഥിയെ തിരഞ്ഞെടുക്കുക</label>
                <select id="selectStudent" class="form-select"></select>
            </div>
            <button onclick="registerParticipant()" class="btn btn-info text-white mb-3">മത്സരത്തിലേക്ക് ചേർക്കുക</button>
            
            <hr>
            <h5>മാർക്ക് എൻട്രി</h5>
            <div id="participantsListForMarks"></div>
        </div>
    </div>

    <!-- Firebase SDKs & Main Script -->
    <script type="module" src="app.js"></script>
</body>
</html>
